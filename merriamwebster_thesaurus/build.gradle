// :merriamwebster_thesaurus is a dynamic feature module which includes all code necessary to
// work with the the Merriam-Webster Thesaurus api and display it's data.

apply plugin: 'com.android.dynamic-feature'
apply plugin: 'kotlin-android'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: "com.google.devtools.ksp"

apply from: '../shared_dependencies.gradle'
apply from: '../test_dependencies.gradle'

android {
    namespace "space.narrate.waylan.merriamwebster_thesaurus"
    compileSdk Versions.compileSdk
    defaultConfig {
        minSdk Versions.minSdk
        targetSdk Versions.targetSdk

        // Merriam Webster Thesaurus key - hidden from VCS
        if (rootProject.file('keys.properties').exists()) {
            def keyProperties = new Properties()
            keyProperties.load(rootProject.file("keys.properties").newDataInputStream())
            def mwThesApiKey = keyProperties.getProperty("merriamWebsterThesaurus.key", "")
            buildConfigField "String", "MERRIAM_WEBSTER_THESAURUS_KEY", mwThesApiKey
        }
    }

    // View/Data binding
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // Compile options
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':app')
    implementation project(':core')

    implementation Libs.moshiKotlin
    implementation Libs.moshiAdapter

    // TODO: Maybe remove since these are in the shared deps module?
    // Room
    implementation Libs.roomRuntime
    ksp Libs.roomCompiler
}