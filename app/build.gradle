// :app is the main application module which holds the Waylan's single MainActivity and basic
// user-facing functionality.

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'io.fabric'
apply plugin: 'org.jetbrains.dokka-android'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: "com.google.devtools.ksp"
apply plugin: 'kotlin-kapt'

apply from: '../shared_dependencies.gradle'
apply from: '../test_dependencies.gradle'

android {
    namespace "space.narrate.waylan.android"
    compileSdk Versions.compileSdk
    defaultConfig {
        applicationId "space.narrate.words.android"
        minSdk Versions.minSdk
        targetSdk Versions.targetSdk
        versionCode Versions.versionCode
        versionName Versions.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    // Build configurations
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
        }
    }

    // View/Data binding
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }

    // Dynamic feature modules
    dynamicFeatures = [":merriamwebster", ":merriamwebster_thesaurus", ':americanheritage']

    // Compile options
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }

    lintOptions {
        checkReleaseBuilds false
    }

    // Documentation
    dokka {
        includes = ['app.md']
        outputFormat = 'html'
        outputDirectory = "$buildDir/javadoc"
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':core')
    implementation project(':settings')
    implementation project(':wordset')
    implementation project(':wordnik')

    // TODO: Maybe remove since these are in the shared deps moduble?
    // Room
    implementation Libs.roomRuntime
    ksp Libs.roomCompiler

    // Firebase & Firestore
    implementation Libs.firebase
    implementation Libs.firebaseAuth
    implementation Libs.firebaseFirestore
    implementation Libs.crashlytics

    // Google Play Billing
    implementation Libs.playBilling
}

apply plugin: 'com.google.gms.google-services'
