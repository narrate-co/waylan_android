// :test_common hold all test dependencies that are used across modules for both unit and
// instrumentation tests.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: "com.google.devtools.ksp"

android {
    namespace "space.narrate.waylan.test_common"
    compileSdk Versions.compileSdk
    defaultConfig {
        minSdk Versions.minSdk
        targetSdk Versions.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    // Build configurations
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Compile options
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':core')

    implementation Libs.appCompat

    implementation Libs.junit
    implementation Libs.kotlinCoroutinesTest
    implementation Libs.kotlinCoroutinesAndroid
    implementation Libs.lifecycleExtensions
    ksp Libs.lifecycleCompiler
    implementation Libs.mockito
    implementation Libs.mockitoInline
    implementation Libs.okhttp3MockWebServer
    implementation Libs.hamcrest
    implementation Libs.espresso
    implementation Libs.espressoContrib
    implementation Libs.espressoIntents
    implementation Libs.retrofit
    implementation Libs.koin
    implementation Libs.koinAndroidViewModel
}
