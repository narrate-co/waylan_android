// :core is a library module which holds dependencies and implementations which are used across
// all modules.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: "com.google.devtools.ksp"
apply plugin: 'kotlin-kapt'

apply from: '../shared_dependencies.gradle'
apply from: '../test_dependencies.gradle'

android {
    namespace "space.narrate.waylan.core"
    compileSdk Versions.compileSdk
    defaultConfig {
        minSdk Versions.minSdk
        targetSdk Versions.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    // Build configurations
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // View/Data binding
    buildFeatures {
        buildConfig = true
        dataBinding = true
        viewBinding = true
    }

    // Compile options
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
}

android {
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // TODO: Maybe remove since this is in the shared_deps module?
    // Room
    implementation Libs.roomRuntime
    ksp Libs.roomCompiler

    // Firebase & Firestore
    implementation Libs.firebase
    implementation Libs.firebaseAuth
    implementation Libs.firebaseFirestore
    implementation Libs.crashlytics

    implementation Libs.dynamicAnimation

    // Google Play Billing
    implementation Libs.playBilling
}
